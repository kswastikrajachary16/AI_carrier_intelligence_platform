{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        Login
                    </h2>

					<form method="POST" action="/login">

					    <div class="mb-3">

					        <label>Email</label>

					        <input
					            type="email"
					            class="form-control"
					            name="email"
					            placeholder="Enter your email"
					            required>

					    </div>

					    <div class="mb-3">

					        <label>Password</label>

					        <input
					            type="password"
					            class="form-control"
					            name="password"
					            placeholder="Enter your password"
					            required>

					    </div>
						<div class="text-end mb-3">
						    <a href="{{ url_for('forgot_password') }}">
						        Forgot Password?
						    </a>
						</div>

					    <button
					        type="submit"
					        class="btn btn-primary w-100">

					        Login

					    </button>

					</form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
