{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">

                        Register

                    </h2>

					<form method="POST" action="/register">

					    <div class="mb-3">
					        <label>Full Name</label>
					        <input
					            type="text"
					            class="form-control"
					            name="full_name"
					            required>
					    </div>

					    <div class="mb-3">
					        <label>Email</label>
					        <input
					            type="email"
					            class="form-control"
					            name="email"
					            required>
					    </div>

					    <div class="mb-3">
					        <label>Password</label>
					        <input
					            type="password"
					            class="form-control"
					            name="password"
					            required>
					    </div>

					    <button
					        type="submit"
					        class="btn btn-success w-100">

					        Register

					    </button>

					</form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
