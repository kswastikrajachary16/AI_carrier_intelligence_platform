{% extends "layouts/sidebar.html" %}

{% block title %}
My Profile
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>👤 My Profile</h2>

    <p class="text-muted">
        Manage your account information.
    </p>

    <hr>

    <div class="row">

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <img src="https://ui-avatars.com/api/?name={{ user.full_name }}&background=0D6EFD&color=fff&size=200"
                         class="rounded-circle mb-3"
                         width="150">

                    <h4>{{ user.full_name }}</h4>

                    <p class="text-muted">
                        {{ user.email }}
                    </p>

                </div>

            </div>

        </div>

		<div class="card-body">

		    <form method="POST">

		        <div class="mb-3">

		            <label class="form-label">
		                Full Name
		            </label>

		            <input
		                type="text"
		                class="form-control"
		                name="full_name"
		                value="{{ user.full_name }}"
		                required>

		        </div>

		        <div class="mb-3">

		            <label class="form-label">
		                Email
		            </label>

		            <input
		                type="email"
		                class="form-control"
		                name="email"
		                value="{{ user.email }}"
		                required>

		        </div>

		        <div class="mb-3">

		            <label class="form-label">
		                Member Since
		            </label>

		            <input
		                type="text"
		                class="form-control"
		                value="{{ user.created_at.strftime('%d %B %Y') }}"
		                readonly>

		        </div>

		        <button class="btn btn-primary">

		            💾 Save Changes

		        </button>

		    </form>

		</div>

    </div>

</div>

{% endblock %}
